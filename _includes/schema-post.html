{%- assign p = site.practice -%}
{%- capture practice_ref -%}
{"@type": "Optician", "@id": {{ p.main_site | append: '#practice' | jsonify }}, "name": {{ p.name | jsonify }}, "url": "https://kempkerrigan.co.uk", "logo": {{ site.logo | absolute_url | jsonify }}}
{%- endcapture -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BlogPosting",
      "@id": {{ page.url | absolute_url | append: '#article' | jsonify }},
      "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "image": {
        "@type": "ImageObject",
        "url": {{ page.image.path | absolute_url | jsonify }},
        "width": {{ page.image.width | default: 1600 }},
        "height": {{ page.image.height | default: 1067 }}
      },
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "inLanguage": "en-GB",
      "author": {{ practice_ref }},
      "publisher": {{ practice_ref }}
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Blog", "item": {{ '/' | absolute_url | jsonify }}},
        {"@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
      ]
    }
    {%- if page.faqs and page.faqs.size > 0 -%},
    {
      "@type": "FAQPage",
      "@id": {{ page.url | absolute_url | append: '#faqs' | jsonify }},
      "mainEntity": [
        {%- for faq in page.faqs %}
        {
          "@type": "Question",
          "name": {{ faq.question | strip | jsonify }},
          "acceptedAnswer": {"@type": "Answer", "text": {{ faq.answer | markdownify | strip_html | normalize_whitespace | strip | jsonify }}}
        }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
    {%- endif %}
  ]
}
</script>
